name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.24.1

      - name: Build APK
        run: |
          flet build apk --project "Piece Register" --org "com.yourname"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: piece-mobile-apk
          path: build/apk/*.apk
          if-no-files-found: error
