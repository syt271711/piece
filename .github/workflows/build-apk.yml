name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # 移除硬编码 flutter-version，让 flet build 使用兼容版本

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.28.3

      - name: Clean Cookiecutter cache
        run: |
          rm -rf ~/.cookiecutters

      - name: Build APK
        run: |
          flet build apk --project "Piece Register" --org "com.yourname"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: piece-mobile-apk
          path: build/apk/*.apk
          if-no-files-found: error
